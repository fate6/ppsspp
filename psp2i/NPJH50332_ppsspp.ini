# Online settings for Phantasy Star Portable 2 Infinity (NPJH50332) on the psp2i fork of PPSSPP.
# Location: memstick/PSP/SYSTEM/NPJH50332_ppsspp.ini. The Windows release already has it there.
# PPSSPP adds the rest of the game's settings when it saves this file.
[Network]
EnableWlan = True
HostsOverride = True
NpRelay = True
[HostsOverride]
# Every hostname the game looks up goes to the server. The matching server is the same host on port 12021.
* = psp2i-server.invalid
